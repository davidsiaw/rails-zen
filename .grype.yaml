# Grype config, read automatically by the `grype` CircleCI job.
# Only add entries here for findings confirmed not to apply, and say why.
ignore:
  # NVD CPE mismatch: the advisory is for Git for Windows (fixed in
  # 2.55.0.windows.4) and does not apply to Alpine's git.
  - vulnerability: CVE-2026-62960
    package:
      name: git
      type: apk
  # NVD CPE mismatch: the advisory is about Ada.cx's Sentry configuration,
  # not the `ada` URL parser library that Alpine ships as ada-libs.
  - vulnerability: CVE-2024-9410
    package:
      name: ada-libs
      type: apk
