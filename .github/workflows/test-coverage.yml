name: test-coverage
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: compose up
        run: |-
          PUID="$(id -u)" PGID="$(id -g)" docker compose -f docker-compose.unit.yml up -d --wait --build

      - name: run tests
        run: |-
          docker compose -f docker-compose.unit.yml exec rz rspec

      - name: copy coverage report
        run: |-
          mkdir -p coverage
          docker compose -f docker-compose.unit.yml cp rz:/srv/coverage/coverage.json ./coverage/coverage.json

      - name: comment coverage on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage.json', 'utf8'));
            const result = coverage.result;
            const lines = result.lines;
            const covered = result.covered;
            const missed = result.missed;
            const rate = ((covered / lines) * 100).toFixed(1);

            const emoji = rate >= 80 ? '🟢' : rate >= 50 ? '🟡' : '🔴';
            const body = `## ${emoji} Test Coverage

            | Metric | Value |
            |--------|-------|
            | **Lines Covered** | ${covered} / ${lines} (${rate}%) |
            | **Missed** | ${missed} lines |

            _Report generated by SimpleCov_`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
